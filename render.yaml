# Blueprint de Render: API + Postgres. Crear en dashboard.render.com > New > Blueprint.
services:
  - type: web
    name: agrotracker-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrotracker-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: IA_PROVEEDOR
        value: simulado
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: agrotracker-db
    plan: free
